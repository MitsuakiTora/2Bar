<!DOCTYPE html>
<html>
    <head>
        <title>2Bar</title>
        <link rel="stylesheet" href="style.css">
        <script src="2bar.min.js"></script>
    </head>
    <body>
        <article>
            <h1>2Bar</h1>
            <hr>
            <p>An experimental project that exploits an SVG filter rendering behavior in Chromium-based browsers to visually duplicate the bookmark toolbar using CSS.</p>
            <span id="c">Copyright &copy; 2026 <a href="https://justdeveloper.is-a.dev/" target="_blank">JustDeveloper</a></span>
            <a href="https://github.com/JustDeveloper1/2Bar" target="_blank">GitHub Repo</a>
        </article>
        <script defer>
            window['2Bar'].spawn();
            setTimeout(()=>document.documentElement.style.background = '#3c3c3c', 10);
            document.getElementById('c').onclick=()=>window.open('https://justdeveloper.is-a.dev/', '_blank');

            function isChromium() {
                if (navigator.userAgentData) {
                    const brands = navigator.userAgentData.brands;
                    for (const brand_version_pair of brands) {
                        if (brand_version_pair.brand === "Chromium") {
                            return true;
                        }
                    }
                }
                return navigator.userAgent.includes("Chrome") || navigator.userAgent.includes("Chromium");
            }
            if (!isChromium()) alert('Unsupported browser. This project only supports Chromium-based browsers. You may not see any visual effects.');
        </script>
    </body>
</html>
